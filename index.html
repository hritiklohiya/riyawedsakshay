  <!-- error reporter: open the page with ?debug at the end of the address to see problems on the screen -->
  <script>
  if (/[?&]debug/.test(location.search)) {
    var showErr = function (t) {
      var b = document.getElementById('errbox');
      if (!b) { b = document.createElement('pre'); b.id = 'errbox'; b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;margin:0;padding:8px;background:#b00020;color:#fff;font:12px monospace;white-space:pre-wrap;max-height:45vh;overflow:auto'; document.documentElement.appendChild(b); }
      b.textContent += t + '\n';
    };
    window.addEventListener('error', function (e) {
      if (e.target && e.target !== window && (e.target.src || e.target.href)) showErr('NOT FOUND: ' + (e.target.src || e.target.href));
      else showErr('ERROR: ' + e.message + '  [' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ']');
    }, true);
  }
  </script>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
